[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfarm-state-revalidation"
version = "0.1.0"
description = "Isolated evaluation harness for execution-time SmartFarm state revalidation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
smartfarm-state-revalidation = "smartfarm_state_revalidation.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
